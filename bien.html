<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neurofile - Sistema Completo ✅</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/crypto-js@4.1.1/crypto-js.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        
        .header { 
            background: white; 
            padding: 25px; 
            border-radius: 20px; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.2); 
            margin-bottom: 25px; 
            text-align: center; 
        }
        .header h1 { color: #2d3748; margin-bottom: 10px; font-size: 2.5em; }
        
        .nav-tabs { 
            display: flex; 
            gap: 15px; 
            justify-content: center; 
            flex-wrap: wrap; 
            margin: 20px 0; 
        }
        .nav-tabs button { 
            padding: 12px 25px; 
            border: none; 
            border-radius: 30px; 
            background: #667eea; 
            color: white; 
            cursor: pointer; 
            transition: all 0.3s; 
            font-weight: 600;
            min-width: 150px;
        }
        .nav-tabs button:hover { background: #5a67d8; transform: translateY(-3px); }
        .nav-tabs button.active { background: #48bb78; box-shadow: 0 5px 20px rgba(72,187,120,0.4); }
        
        .section { 
            background: white; 
            padding: 35px; 
            border-radius: 20px; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.15); 
            margin-bottom: 25px; 
            display: none; 
        }
        .section.active { display: block; }
        
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; }
        .form-group { margin-bottom: 25px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #2d3748; font-size: 1.1em; }
        input, textarea, select { 
            width: 100%; 
            padding: 15px; 
            border: 2px solid #e2e8f0; 
            border-radius: 12px; 
            font-size: 16px; 
            transition: all 0.3s; 
        }
        input:focus, textarea:focus, select:focus { 
            outline: none; 
            border-color: #667eea; 
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1); 
        }
        
        .btn { 
            background: linear-gradient(45deg, #48bb78, #38a169); 
            color: white; 
            padding: 15px 30px; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: 600; 
            transition: all 0.3s; 
            width: 100%; 
            margin-top: 10px;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(72,187,120,0.4); }
        .btn-danger { background: linear-gradient(45deg, #f56565, #e53e3e); }
        .btn-danger:hover { box-shadow: 0 10px 25px rgba(245,101,101,0.4); }
        .btn-warning { background: linear-gradient(45deg, #ed8936, #dd6b20); }
        .btn-warning:hover { box-shadow: 0 10px 25px rgba(237,137,54,0.4); }
        .btn-secondary { background: linear-gradient(45deg, #a0aec0, #718096); }
        .btn-small { width: auto; padding: 10px 20px; margin: 5px; }
        
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 25px; }
        .card { 
            background: linear-gradient(135deg, #f7fafc, #edf2f7); 
            padding: 25px; 
            border-radius: 15px; 
            border-left: 5px solid #667eea; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            transition: all 0.3s;
        }
        .card:hover { transform: translateY(-5px); box-shadow: 0 15px 40px rgba(0,0,0,0.15); }
        .card h3 { color: #2d3748; margin-bottom: 15px; font-size: 1.4em; }
        
        .patient-card, .record-card { 
            background: white; 
            padding: 20px; 
            margin-bottom: 15px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.08); 
        }
        
        .modal { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: rgba(0,0,0,0.6); 
            z-index: 10000; 
            align-items: center; 
            justify-content: center; 
            padding: 20px;
        }
        .modal.active { display: flex; }
        .modal-content { 
            background: white; 
            padding: 40px; 
            border-radius: 20px; 
            max-width: 600px; 
            width: 100%; 
            max-height: 90vh; 
            overflow-y: auto; 
        }
        .close-modal { 
            position: absolute; 
            top: 20px; 
            right: 25px; 
            font-size: 28px; 
            cursor: pointer; 
            color: #a0aec0; 
        }
        .close-modal:hover { color: #f56565; }
        
        .alert { padding: 20px; border-radius: 12px; margin: 20px 0; font-weight: 500; }
        .alert-success { background: #c6f6d5; color: #22543d; border-left: 5px solid #48bb78; }
        .alert-error { background: #fed7d7; color: #742a2a; border-left: 5px solid #f56565; }
        
        .user-welcome { 
            background: linear-gradient(135deg, #667eea, #764ba2); 
            color: white; 
            padding: 25px; 
            border-radius: 15px; 
            text-align: center; 
            margin-bottom: 30px; 
        }
        
        .code-input-container {
            background: #f0f9ff;
            padding: 25px;
            border-radius: 15px;
            border: 3px dashed #0ea5e9;
            margin: 25px 0;
            text-align: center;
        }
        .code-input-container input {
            font-size: 1.4em;
            font-weight: bold;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-align: center;
            border: 3px solid #0ea5e9;
            background: white;
        }
        
        .logs-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .logs-table th, .logs-table td { padding: 12px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        .logs-table th { background: #f7fafc; font-weight: 600; }
        
        @media (max-width: 768px) {
            .form-grid, .cards-grid { grid-template-columns: 1fr; }
            .nav-tabs { flex-direction: column; align-items: center; }
            .container { padding: 10px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER PRINCIPAL -->
        <div class="header">
            <h1>🧠 NEUROFILE</h1>
            <p>Sistema Integral de Gestión Psicológica</p>
            
            <!-- NAVEGACIÓN PÚBLICA -->
            <div id="publicNav" class="nav-tabs">
                <button class="active" onclick="showSection('login')">🔐 Iniciar Sesión</button>
                <button onclick="showSection('register-patient')">👤 Registro Paciente</button>
                <button onclick="showSection('register-specialist')">👨‍⚕️ Registro Especialista</button>
            </div>
            
            <!-- NAVEGACIÓN USUARIO -->
            <div id="userNav" class="nav-tabs" style="display: none;">
                <span id="userWelcome" style="color: white; font-weight: 600; padding: 12px 25px; background: rgba(255,255,255,0.2); border-radius: 30px; margin-right: 15px;"></span>
                <button onclick="showSection('dashboard')">📊 Dashboard</button>
                <button onclick="loadProfile()">👤 Mi Perfil</button>
                <button onclick="logout()">🚪 Cerrar Sesión</button>
            </div>
        </div>

        <!-- RF-03: INICIO DE SESIÓN -->
        <div id="login" class="section active">
            <h2>🔐 Iniciar Sesión</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label>Correo Electrónico</label>
                    <input type="email" id="loginEmail" placeholder="tu@email.com" required>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required>
                </div>
            </div>
            <button class="btn" onclick="loginUser()">🚀 Iniciar Sesión</button>
            <div style="text-align: center; margin-top: 20px;">
                <button class="btn-secondary" onclick="showSection('forgot-password')">🔑 ¿Olvidaste tu contraseña?</button>
            </div>
            <div style="margin-top: 30px; padding: 20px; background: #f7fafc; border-radius: 12px;">
                <strong>💡 Prueba rápida:</strong><br>
                Admin: <code>admin@neurofile.com</code> / <code>admin123</code><br>
                Paciente: <code>prueba@email.com</code> / <code>123456</code>
            </div>
        </div>

        <!-- RF-01: REGISTRO ESPECIALISTA -->
        <div id="register-specialist" class="section">
            <h2>👨‍⚕️ Registro Especialista</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label>Nombre Completo *</label>
                    <input type="text" id="specName" placeholder="Juan Pérez López" required>
                </div>
                <div class="form-group">
                    <label>Correo Electrónico *</label>
                    <input type="email" id="specEmail" placeholder="juan@consultorio.com" required>
                </div>
                <div class="form-group">
                    <label>Contraseña *</label>
                    <input type="password" id="specPassword" placeholder="Mínimo 6 caracteres" required>
                </div>
                <div class="form-group">
                    <label>Título Profesional *</label>
                    <input type="text" id="specTitle" placeholder="Psicólogo Clínico" required>
                </div>
                <div class="form-group">
                    <label>Cédula Profesional *</label>
                    <input type="text" id="specLicense" placeholder="1234567" required>
                </div>
                <div class="form-group">
                    <label>Dirección Consultorio *</label>
                    <textarea id="specAddress" rows="3" placeholder="Calle Principal #123, Colonia Centro" required></textarea>
                </div>
            </div>
            <button class="btn" onclick="registerSpecialist()">✅ Registrarse</button>
        </div>

        <!-- RF-02: REGISTRO PACIENTE -->
        <div id="register-patient" class="section">
            <h2>👤 Registro Paciente</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label>Nombre de Usuario *</label>
                    <input type="text" id="patientUsername" placeholder="miusuario123" required>
                </div>
                <div class="form-group">
                    <label>Correo Electrónico *</label>
                    <input type="email" id="patientEmail" placeholder="paciente@email.com" required>
                </div>
                <div class="form-group">
                    <label>Contraseña *</label>
                    <input type="password" id="patientPassword" placeholder="Mínimo 6 caracteres" required>
                </div>
            </div>
            <button class="btn" onclick="registerPatient()">✅ Registrarse</button>
        </div>

        <!-- RF-04: RECUPERACIÓN -->
        <div id="forgot-password" class="section">
            <h2>🔑 Recuperar Contraseña</h2>
            <div class="form-group">
                <label>Correo Electrónico</label>
                <input type="email" id="recoverEmail" placeholder="tu@email.com" required>
            </div>
            <button class="btn" onclick="recoverPassword()">📧 Enviar Código</button>
            <div id="recoveryResult"></div>
        </div>

        <!-- DASHBOARD -->
        <div id="dashboard" class="section">
            <div id="dashboard-content"></div>
        </div>

        <!-- PERFIL -->
        <div id="profile" class="section">
            <div id="profile-content"></div>
        </div>

        <!-- RECORDS -->
        <div id="patient-records" class="section">
            <div id="records-content"></div>
        </div>

        <!-- MODAL -->
        <div id="modal" class="modal">
            <div class="modal-content">
                <span class="close-modal" onclick="closeModal()">&times;</span>
                <div id="modal-body"></div>
            </div>
        </div>
    </div>

    <script>
        // ==================== BASE DE DATOS ====================
        let neurofileDB = JSON.parse(localStorage.getItem('neurofile_fixed_db')) || {
            specialists: [],
            patients: [],
            records: [],
            permissions: [],
            comments: [],
            logs: [],
            admin: []
        };

        let currentUser = null;
        let currentPatient = null;
        let currentUserType = null;

        // Admin por defecto
        if (neurofileDB.admin.length === 0) {
            neurofileDB.admin = [{
                id: 'admin_001',
                email: 'admin@neurofile.com',
                password: CryptoJS.SHA256('admin123').toString(),
                name: 'Administrador del Sistema',
                role: 'admin'
            }];
            saveDatabase();
        }

        // Datos de prueba
        if (neurofileDB.patients.length === 0) {
            neurofileDB.patients.push({
                id: 'pat_test1',
                username: 'pacienteprueba',
                email: 'prueba@email.com',
                password: CryptoJS.SHA256('123456').toString(),
                active: true,
                createdAt: new Date().toISOString()
            });
            saveDatabase();
        }

        // ==================== RF-03: LOGIN ====================
        function loginUser() {
            const email = document.getElementById('loginEmail').value.trim().toLowerCase();
            const password = CryptoJS.SHA256(document.getElementById('loginPassword').value).toString();

            const specialist = neurofileDB.specialists.find(s => s.email === email && s.password === password && s.active);
            const patient = neurofileDB.patients.find(p => p.email === email && p.password === password && p.active !== false);
            const adminUser = neurofileDB.admin.find(a => a.email === email && a.password === password);

            if (specialist) {
                currentUser = specialist;
                currentUserType = 'specialist';
                showUserInterface();
                loadSpecialistDashboard();
            } else if (patient) {
                currentUser = patient;
                currentUserType = 'patient';
                showUserInterface();
                loadPatientDashboard();
            } else if (adminUser) {
                currentUser = adminUser;
                currentUserType = 'admin';
                showUserInterface();
                loadAdminDashboard();
            } else {
                showAlert('error', '❌ Credenciales incorrectas');
            }
            addLog('LOGIN_INTENTO', email);
        }

        // ==================== RF-01: REGISTRO ESPECIALISTA ====================
        function registerSpecialist() {
            const email = document.getElementById('specEmail').value.trim().toLowerCase();
            
            if (neurofileDB.specialists.find(s => s.email === email) || neurofileDB.patients.find(p => p.email === email)) {
                return showAlert('error', '❌ Email ya registrado');
            }

            const newSpecialist = {
                id: 'spec_' + Date.now(),
                name: document.getElementById('specName').value.trim(),
                email: email,
                password: CryptoJS.SHA256(document.getElementById('specPassword').value).toString(),
                title: document.getElementById('specTitle').value.trim(),
                license: document.getElementById('specLicense').value.trim(),
                address: document.getElementById('specAddress').value.trim(),
                active: true,
                createdAt: new Date().toISOString()
            };

            neurofileDB.specialists.push(newSpecialist);
            saveDatabase();
            showAlert('success', '✅ Especialista registrado. Ya puedes iniciar sesión.');
            setTimeout(() => showSection('login'), 2000);
        }

        // ==================== RF-02: REGISTRO PACIENTE ====================
        function registerPatient() {
            const email = document.getElementById('patientEmail').value.trim().toLowerCase();
            
            if (neurofileDB.patients.find(p => p.email === email) || neurofileDB.specialists.find(s => s.email === email)) {
                return showAlert('error', '❌ Email ya registrado');
            }

            const newPatient = {
                id: 'pat_' + Date.now(),
                username: document.getElementById('patientUsername').value.trim(),
                email: email,
                password: CryptoJS.SHA256(document.getElementById('patientPassword').value).toString(),
                active: true,
                createdAt: new Date().toISOString()
            };

            neurofileDB.patients.push(newPatient);
            saveDatabase();
            showAlert('success', '✅ Paciente registrado. Ya puedes iniciar sesión.');
            setTimeout(() => showSection('login'), 2000);
        }

        // ==================== RF-13: GENERAR CÓDIGO PACIENTE ====================
        function generateAuthCode() {
            const code = 'AUTH_' + Math.random().toString(36).substr(2, 8).toUpperCase();
            const permission = {
                id: 'perm_' + Date.now(),
                patientId: currentUser.id,
                patientName: currentUser.username,
                code: code,
                specialistId: null,
                active: true,
                createdAt: new Date().toISOString()
            };

            neurofileDB.permissions.push(permission);
            saveDatabase();
            
            showModal(`
                <h3 style="color: #48bb78;">🎫 ¡CÓDIGO GENERADO!</h3>
                <div style="text-align: center; padding: 30px; background: linear-gradient(135deg, #f0fff4, #c6f6d5); border-radius: 20px; margin: 25px 0;">
                    <div style="font-size: 3em; font-weight: bold; color: #38a169; letter-spacing: 8px; margin-bottom: 15px; text-shadow: 2px 2px 4px rgba(0,0,0,0.1);">
                        ${code}
                    </div>
                    <p style="font-size: 1.2em; color: #2d3748;">Comparte este código con tu especialista</p>
                </div>
                <div style="text-align: center;">
                    <button class="btn" onclick="closeModal()">✅ Código Copiado</button>
                    <button class="btn-secondary" onclick="generateAuthCode()" style="margin-left: 15px;">🔄 Nuevo Código</button>
                </div>
            `);
        }

        // ==================== RF-14: **FUNCIÓN CORREGIDA** SOLICITAR ACCESO ====================
        function requestPatientAccess() {
            const codeInput = document.getElementById('specialistAccessCode').value.trim().toUpperCase();
            if (!codeInput) {
                return showAlert('error', '❌ Ingresa un código');
            }

            // **CORREGIDO**: Buscar permiso por código exacto
            const permission = neurofileDB.permissions.find(p => p.code === codeInput && p.active);
            
            if (permission) {
                // **CORREGIDO**: Asignar correctamente al especialista
                permission.specialistId = currentUser.id;
                permission.specialistName = currentUser.name;
                permission.updatedAt = new Date().toISOString();
                
                saveDatabase();
                
                // **CORREGIDO**: Limpiar input y mostrar éxito
                document.getElementById('specialistAccessCode').value = '';
                showAlert('success', `✅ ¡ACCESO CONCEDIDO! Ahora puedes ver el expediente de <strong>${permission.patientName}</strong>`);
                
                // **CORREGIDO**: Recargar dashboard para mostrar paciente
                setTimeout(() => loadSpecialistDashboard(), 1500);
                
                addLog('ACCESO_CONCEDIDO', `${currentUser.name} -> ${permission.patientName} (${codeInput})`);
            } else {
                showAlert('error', `❌ Código <strong>${codeInput}</strong> no válido o expirado`);
                document.getElementById('specialistAccessCode').value = '';
            }
        }

        // ==================== DASHBOARD ESPECIALISTA **CORREGIDO** ====================
        function loadSpecialistDashboard() {
            const authorizedPatients = neurofileDB.patients.filter(p => 
                neurofileDB.permissions.some(perm => 
                    perm.patientId === p.id && 
                    perm.specialistId === currentUser.id && 
                    perm.active
                )
            );

            let html = `
                <div class="user-welcome">
                    <h2>👨‍⚕️ ${currentUser.name}</h2>
                    <p>${currentUser.title} | Cédula: ${currentUser.license} | ${currentUser.address}</p>
                </div>
                
                <!-- **SECCIÓN CORREGIDA PARA CÓDIGO** -->
                <div class="code-input-container">
                    <h3 style="color: #0ea5e9; margin-bottom: 15px;">🔑 Solicitar Acceso a Paciente</h3>
                    <input type="text" id="specialistAccessCode" placeholder="AUTH_ABC12345" maxlength="20" style="font-size: 1.5em; padding: 20px;">
                    <br><br>
                    <button class="btn" onclick="requestPatientAccess()" style="width: auto; padding: 15px 40px; font-size: 1.2em;">✅ AUTORIZAR ACCESO</button>
                    <p style="margin-top: 15px; color: #666; font-size: 0.95em;">
                        Pide el código al paciente y pégalo aquí
                    </p>
                </div>
            `;

            if (authorizedPatients.length > 0) {
                html += `
                    <h2 style="color: #48bb78;">📋 Tus Pacientes Autorizados (${authorizedPatients.length})</h2>
                    <div class="cards-grid">
                `;
                
                authorizedPatients.forEach(patient => {
                    html += `
                        <div class="card patient-card">
                            <h3>👤 ${patient.username}</h3>
                            <p><strong>Correo:</strong> ${patient.email}</p>
                            ${patient.profile ? `
                                <div style="background: #f0fff4; padding: 15px; border-radius: 10px; margin: 15px 0;">
                                    <strong>Perfil:</strong> ${patient.profile.basicInfo.substring(0, 120)}...
                                </div>
                            ` : '<p style="color: #ed8936;">⚠️ Sin perfil clínico aún</p>'}
                            <div>
                                <button class="btn" onclick="loadPatientRecords('${patient.id}')" style="margin-right: 10px;">📁 Expediente Completo</button>
                                <button class="btn-warning" onclick="createClinicalProfile('${patient.id}')">➕ Perfil Clínico</button>
                            </div>
                        </div>
                    `;
                });
                html += '</div>';
            } else {
                html += `
                    <div class="alert alert-warning" style="text-align: center;">
                        <h3>👆 Solicita acceso ingresando un código arriba</h3>
                        <p>Una vez autorizado, aparecerán aquí tus pacientes</p>
                    </div>
                `;
            }

            document.getElementById('dashboard-content').innerHTML = html;
        }

        // Resto de funciones SIN CAMBIOS (ya funcionan perfecto)
        function loadPatientDashboard() {
            let html = `
                <div class="user-welcome">
                    <h2>👤 ${currentUser.username}</h2>
                    <p>Gestión de tu expediente clínico</p>
                </div>
                <div class="cards-grid">
                    <div class="card">
                        <h3>📋 Mi Perfil</h3>
                        <p><strong>Usuario:</strong> ${currentUser.username}</p>
                        <p><strong>Email:</strong> ${currentUser.email}</p>
                    </div>
                    <div class="card">
                        <h3>🎫 Autorizaciones</h3>
                        <button class="btn" onclick="generateAuthCode()">🔑 Generar Código</button>
                        <div id="authList"></div>
                    </div>
                </div>
            `;

            const activeAuths = neurofileDB.permissions.filter(p => p.patientId === currentUser.id && p.active);
            let authHtml = '';
            activeAuths.forEach(p => {
                if (p.specialistId) {
                    const spec = neurofileDB.specialists.find(s => s.id === p.specialistId);
                    authHtml += `
                        <div class="patient-card" style="display: flex; justify-content: space-between;">
                            <span><strong>${spec?.name}</strong></span>
                            <button class="btn-danger btn-small" onclick="revokePermission('${p.id}')">Revocar</button>
                        </div>
                    `;
                }
            });
            html = html.replace('id="authList"', `id="authList">${authHtml}`);
            
            document.getElementById('dashboard-content').innerHTML = html;
        }


        // ==================== PERFIL DE USUARIO ====================
function loadProfile() {

    let html = '';

    // ==================== PERFIL PACIENTE ====================
    if (currentUserType === 'patient') {

        const permissions =
            neurofileDB.permissions.filter(
                p => p.patientId === currentUser.id && p.specialistId
            );

        html = `
            <div class="user-welcome">
                <h2>👤 Perfil del Paciente</h2>
                <p>Información de tu cuenta</p>
            </div>

            <div class="cards-grid">

                <div class="card">
                    <h3>🧾 Información General</h3>

                    <p><strong>Usuario:</strong>
                    ${currentUser.username}</p>

                    <p><strong>Correo:</strong>
                    ${currentUser.email}</p>

                    <p><strong>ID:</strong>
                    ${currentUser.id}</p>

                    <p><strong>Fecha de Registro:</strong>
                    ${new Date(currentUser.createdAt).toLocaleDateString()}</p>
                </div>

                <div class="card">
                    <h3>👨‍⚕️ Especialistas Autorizados</h3>

                    ${

                                <div style="

                                    padding:12px;
                                    border-radius:10px;
                                    margin:10px 0;
                                ">
                                    <strong>${spec?.name || 'Especialista'}</strong><br>
                                    ${spec?.title || ''}

                            `;
                        }).join('')
                        :
                        '<p>⚠️ No tienes especialistas autorizados aún</p>'
                    }
                </div>

            </div>
        `;
    }

    // ==================== PERFIL ESPECIALISTA ====================
    if (currentUserType === 'specialist') {

        const totalPatients =
            neurofileDB.permissions.filter(
                p => p.specialistId === currentUser.id && p.active
            ).length;

        const totalRecords =
            neurofileDB.records.filter(
                r => r.specialistId === currentUser.id
            ).length;

        html = `
            <div class="user-welcome">
                <h2>👨‍⚕️ Perfil del Especialista</h2>
                <p>Información profesional</p>
            </div>

            <div class="cards-grid">

                <div class="card">

                    <h3>🧾 Datos Profesionales</h3>

                    <p><strong>Nombre:</strong>
                    ${currentUser.name}</p>

                    <p><strong>Correo:</strong>
                    ${currentUser.email}</p>

                    <p><strong>Título:</strong>
                    ${currentUser.title}</p>

                    <p><strong>Cédula:</strong>
                    ${currentUser.license}</p>

                    <p><strong>Consultorio:</strong>
                    ${currentUser.address}</p>

                    <p><strong>Registro:</strong>
                    ${new Date(currentUser.createdAt).toLocaleDateString()}</p>

                </div>

                <div class="card">

                    <h3>📊 Estadísticas</h3>

                    <p><strong>Pacientes autorizados:</strong>
                    ${totalPatients}</p>

                    <p><strong>Registros clínicos creados:</strong>
                    ${totalRecords}</p>

                    <p><strong>Estado:</strong>
                    🟢 Activo</p>

                </div>

            </div>
        `;
    }

    // ==================== PERFIL ADMIN ====================
    if (currentUserType === 'admin') {

        html = `
            <div class="user-welcome">
                <h2>🛠️ Perfil Administrador</h2>
            </div>

            <div class="card">

                <h3>🔐 Datos del Administrador</h3>

                <p><strong>Nombre:</strong>
                ${currentUser.name}</p>

                <p><strong>Correo:</strong>
                ${currentUser.email}</p>

                <p><strong>Rol:</strong>
                Administrador General</p>

            </div>
        `;
    }

    document.getElementById('profile-content').innerHTML = html;

    showSection('profile');
}

        // Funciones auxiliares (sin cambios)
        function showSection(id) { document.querySelectorAll('.section').forEach(s => s.classList.remove('active')); document.getElementById(id)?.classList.add('active'); }
        function showUserInterface() { document.getElementById('publicNav').style.display = 'none'; document.getElementById('userNav').style.display = 'flex'; document.getElementById('userWelcome').textContent = currentUser.name || currentUser.username; showSection('dashboard'); }
        function logout() { currentUser = null; document.getElementById('publicNav').style.display = 'flex'; document.getElementById('userNav').style.display = 'none'; showSection('login'); }
        function showAlert(type, msg) { const div = document.createElement('div'); div.className = `alert alert-${type}`; div.innerHTML = msg; document.querySelector('.container').insertBefore(div, document.querySelector('.header').nextSibling); setTimeout(() => div.remove(), 5000); }
        function showModal(content) { document.getElementById('modal-body').innerHTML = content; document.getElementById('modal').classList.add('active'); }
        function closeModal() { document.getElementById('modal').classList.remove('active'); }
        function saveDatabase() { localStorage.setItem('neurofile_fixed_db', JSON.stringify(neurofileDB)); }
        function addLog(action, details) { neurofileDB.logs.push({timestamp: new Date().toISOString(), action, user: currentUser.name || currentUser.username, details}); saveDatabase(); }
        // ==================== RF-05 CREAR PERFIL CLÍNICO ====================
function createClinicalProfile(patientId) {

    const patient = neurofileDB.patients.find(p => p.id === patientId);

    showModal(`
        <h2>📋 Crear Perfil Clínico</h2>

        <div class="form-group">
            <label>Información Básica</label>
            <textarea id="basicInfo" rows="5"
            placeholder="Motivo de consulta, antecedentes, diagnóstico inicial..."></textarea>
        </div>

        <button class="btn" onclick="saveClinicalProfile('${patientId}')">
            💾 Guardar Perfil
        </button>
    `);
}

// ==================== GUARDAR PERFIL ====================
function saveClinicalProfile(patientId) {

    const patient = neurofileDB.patients.find(p => p.id === patientId);

    patient.profile = {
        basicInfo: document.getElementById('basicInfo').value,
        createdBy: currentUser.name,
        createdAt: new Date().toISOString()
    };

    saveDatabase();

    closeModal();

    showAlert('success', '✅ Perfil clínico creado');

    loadSpecialistDashboard();
}

// ==================== RF-08 VER EXPEDIENTE ====================
function loadPatientRecords(patientId) {

    currentPatient = neurofileDB.patients.find(p => p.id === patientId);

    const patientRecords = neurofileDB.records.filter(r => r.patientId === patientId);

    let html = `
        <div class="user-welcome">
            <h2>📁 Expediente Clínico</h2>
            <p>Paciente: ${currentPatient.username}</p>
        </div>

        <button class="btn" onclick="showCreateRecordModal('${patientId}')">
            ➕ Nuevo Registro Clínico
        </button>

        <button class="btn-warning" onclick="downloadPDF('${patientId}')">
            📄 Descargar PDF
        </button>

        <hr style="margin: 30px 0;">

        <h2>📝 Registros Clínicos</h2>
    `;

    if (patientRecords.length === 0) {

        html += `
            <div class="alert alert-warning">
                ⚠️ No existen registros clínicos todavía
            </div>
        `;

    } else {

        patientRecords.forEach(record => {

            html += `
                <div class="record-card">

                    <h3>📌 ${record.title}</h3>

                    <p>
                        <strong>Especialista:</strong>
                        ${record.specialistName}
                    </p>

                    <p>
                        <strong>Fecha:</strong>
                        ${new Date(record.createdAt).toLocaleString()}
                    </p>

                    <div style="
                        background:#f7fafc;
                        padding:15px;
                        border-radius:10px;
                        margin:15px 0;
                    ">
                        ${record.content}
                    </div>

                    <!-- RF-16 COMENTARIOS -->
                    <h4>💬 Comentarios</h4>

                    ${(record.comments || []).map(comment => `
                        <div style="
                            background:#edf2f7;
                            padding:10px;
                            margin:10px 0;
                            border-radius:10px;
                        ">
                            <strong>${comment.author}</strong><br>
                            ${comment.text}
                        </div>
                    `).join('')}

                    <textarea
                        id="comment_${record.id}"
                        placeholder="Agregar comentario..."
                    ></textarea>

                    <button class="btn-small btn"
                        onclick="addComment('${record.id}')">
                        💬 Comentar
                    </button>

                    <hr style="margin:15px 0;">

                    <!-- RF-09 EDITAR -->
                    <button class="btn-warning btn-small"
                        onclick="editRecord('${record.id}')">
                        ✏️ Editar
                    </button>

                    <!-- RF-10 ELIMINAR -->
                    <button class="btn-danger btn-small"
                        onclick="deleteRecord('${record.id}')">
                        🗑️ Eliminar
                    </button>

                </div>
            `;
        });
    }

    document.getElementById('records-content').innerHTML = html;

    showSection('patient-records');
}

// ==================== RF-08 CREAR REGISTRO ====================
function showCreateRecordModal(patientId) {

    showModal(`
        <h2>📝 Nuevo Registro Clínico</h2>

        <div class="form-group">
            <label>Título</label>
            <input type="text" id="recordTitle">
        </div>

        <div class="form-group">
            <label>Notas Clínicas</label>
            <textarea id="recordContent" rows="8"></textarea>
        </div>

        <button class="btn"
            onclick="saveClinicalRecord('${patientId}')">
            💾 Guardar Registro
        </button>
    `);
}

// ==================== GUARDAR REGISTRO ====================
function saveClinicalRecord(patientId) {

    const newRecord = {

        id: 'record_' + Date.now(),

        patientId: patientId,

        specialistId: currentUser.id,

        specialistName: currentUser.name,

        title: document.getElementById('recordTitle').value,

        content: document.getElementById('recordContent').value,

        comments: [],

        createdAt: new Date().toISOString()
    };

    neurofileDB.records.push(newRecord);

    saveDatabase();

    closeModal();

    showAlert('success', '✅ Registro clínico creado');

    loadPatientRecords(patientId);
}

// ==================== RF-09 EDITAR ====================
function editRecord(recordId) {

    const record = neurofileDB.records.find(r => r.id === recordId);

    showModal(`
        <h2>✏️ Editar Registro</h2>

        <div class="form-group">
            <label>Título</label>
            <input type="text" id="editTitle"
            value="${record.title}">
        </div>

        <div class="form-group">
            <label>Contenido</label>
            <textarea id="editContent"
            rows="8">${record.content}</textarea>
        </div>

        <button class="btn"
        onclick="updateRecord('${recordId}')">
            💾 Guardar Cambios
        </button>
    `);
}

// ==================== ACTUALIZAR ====================
function updateRecord(recordId) {

    const record = neurofileDB.records.find(r => r.id === recordId);

    record.title =
        document.getElementById('editTitle').value;

    record.content =
        document.getElementById('editContent').value;

    record.updatedAt = new Date().toISOString();

    saveDatabase();

    closeModal();

    showAlert('success', '✅ Registro actualizado');

    loadPatientRecords(record.patientId);
}

// ==================== RF-10 ELIMINAR ====================
function deleteRecord(recordId) {

    if (!confirm('¿Eliminar este registro clínico?')) return;

    const record =
        neurofileDB.records.find(r => r.id === recordId);

    neurofileDB.records =
        neurofileDB.records.filter(r => r.id !== recordId);

    saveDatabase();

    showAlert('success', '✅ Registro eliminado');

    loadPatientRecords(record.patientId);
}

// ==================== RF-16 COMENTARIOS ====================
function addComment(recordId) {

    const record =
        neurofileDB.records.find(r => r.id === recordId);

    const text =
        document.getElementById(`comment_${recordId}`).value;

    if (!text.trim()) return;

    record.comments.push({

        author: currentUser.name,

        text: text,

        createdAt: new Date().toISOString()
    });

    saveDatabase();

    loadPatientRecords(record.patientId);
}

// ==================== RF-12 PDF ====================
function downloadPDF(patientId) {

    const patient =
        neurofileDB.patients.find(p => p.id === patientId);

    const patientRecords =
        neurofileDB.records.filter(r => r.patientId === patientId);

    const { jsPDF } = window.jspdf;

    const doc = new jsPDF();

    doc.setFontSize(20);

    doc.text('NEUROFILE - EXPEDIENTE CLÍNICO', 20, 20);

    doc.setFontSize(14);

    doc.text(`Paciente: ${patient.username}`, 20, 40);

    let y = 60;

    patientRecords.forEach(record => {

        doc.setFontSize(12);

        doc.text(`Título: ${record.title}`, 20, y);

        y += 10;

        doc.text(`Especialista: ${record.specialistName}`, 20, y);

        y += 10;

        doc.text(`Notas: ${record.content}`, 20, y);

        y += 20;
    });

    doc.save(`Expediente_${patient.username}.pdf`);
}

// ==================== RF-15 REVOCAR ====================
function revokePermission(permissionId) {

    const permission =
        neurofileDB.permissions.find(p => p.id === permissionId);

    permission.active = false;

    saveDatabase();

    showAlert('success', '✅ Acceso revocado');

    loadPatientDashboard();
}

// ==================== RF-04 RECUPERAR ====================
// ==================== RF-04 RECUPERAR CONTRASEÑA ====================
function recoverPassword() {

    const email =
        document.getElementById('recoverEmail')
        .value
        .trim()
        .toLowerCase();

    // Buscar usuario
    const user =
        neurofileDB.patients.find(p => p.email === email) ||
        neurofileDB.specialists.find(s => s.email === email);

    if (!user) {

        return showAlert(
            'error',
            '❌ No existe una cuenta con ese correo'
        );
    }

    // Generar código temporal
    const tempCode =
        Math.random()
        .toString(36)
        .substring(2, 8)
        .toUpperCase();

    user.resetCode = tempCode;

    saveDatabase();

    // Mostrar modal simulando email
    showModal(`

        <h2>📧 Recuperación de Contraseña</h2>

        <div style="
            background:#f0fff4;
            padding:25px;
            border-radius:15px;
            margin-top:20px;
            text-align:center;
        ">

            <p>
                Se simuló el envío de un correo a:
            </p>

            <h3>${email}</h3>

            <p style="margin-top:20px;">
                Código temporal:
            </p>

            <div style="
                font-size:2.2em;
                font-weight:bold;
                color:#38a169;
                letter-spacing:5px;
                margin:20px 0;
            ">
                ${tempCode}
            </div>

        </div>

        <div class="form-group" style="margin-top:20px;">
            <label>Nueva Contraseña</label>

            <input type="password"
                id="newPassword">
        </div>

        <button class="btn"
            onclick="resetPassword('${email}')">

            ✅ Cambiar Contraseña

        </button>
    `);
}

// ==================== CAMBIAR CONTRASEÑA ====================
function resetPassword(email) {

    const newPassword =
        document.getElementById('newPassword').value;

    if (newPassword.length < 6) {

        return showAlert(
            'error',
            '❌ Mínimo 6 caracteres'
        );
    }

    const user =
        neurofileDB.patients.find(p => p.email === email) ||
        neurofileDB.specialists.find(s => s.email === email);

    user.password =
        CryptoJS.SHA256(newPassword).toString();

    delete user.resetCode;

    saveDatabase();

    closeModal();

    showAlert(
        'success',
        '✅ Contraseña actualizada correctamente'
    );

    addLog(
        'PASSWORD_RESET',
        email
    );
}

// ==================== RF-18 ADMINISTRACIÓN ====================

    let html = `

            <p>Gestión y supervisión del sistema</p>
        </div>

        <div class="cards-grid">

            <div class="card">

                <p>${neurofileDB.patients.length}</p>

                <p>${neurofileDB.records.length}</p>
            </div>

        </div>

        <hr style="margin:30px 0;">

        <!-- RF-18 GESTIÓN DE CUENTAS -->
        <h2>👨‍⚕️ Especialistas Registrados</h2>
    `;

    neurofileDB.specialists.forEach(spec => {

        html += `
            <div class="patient-card">

                <h3>${spec.name}</h3>

                <p><strong>Email:</strong> ${spec.email}</p>

                <p><strong>Cédula:</strong> ${spec.license}</p>

                <p>
                    <strong>Estado:</strong>
                    ${spec.active ? '🟢 Activo' : '🔴 Desactivado'}
                </p>

                <button
                    class="${spec.active ? 'btn-danger' : 'btn'} btn-small"
                    onclick="toggleSpecialist('${spec.id}')"
                >
                    ${spec.active ? '🚫 Desactivar' : '✅ Activar'}
                </button>

            </div>
        `;
    });

    html += `
        <hr style="margin:30px 0;">

        <h2>👤 Pacientes Registrados</h2>
    `;

    neurofileDB.patients.forEach(patient => {

        html += `
            <div class="patient-card">

                <h3>${patient.username}</h3>

                <p><strong>Email:</strong> ${patient.email}</p>

                <p>
                    <strong>Estado:</strong>
                    ${patient.active !== false ? '🟢 Activo' : '🔴 Desactivado'}
                </p>

                <button
                    class="${patient.active !== false ? 'btn-danger' : 'btn'} btn-small"
                    onclick="togglePatient('${patient.id}')"
                >
                    ${patient.active !== false ? '🚫 Desactivar' : '✅ Activar'}
                </button>

            </div>
        `;
    });

    // RF-19 LOGS
    html += `
        <hr style="margin:30px 0;">

        <h2>📜 Logs del Sistema</h2>

        <table class="logs-table">

            <tr>
                <th>Fecha</th>

                </tr>
            `).join('')}

        </table>

    document.getElementById('dashboard-content').innerHTML = html;

// ==================== RF-18 DESACTIVAR ESPECIALISTA ====================
function toggleSpecialist(specId) {

    const specialist =
        neurofileDB.specialists.find(s => s.id === specId);

    specialist.active = !specialist.active;

    saveDatabase();

    addLog(
        'CUENTA_ESPECIALISTA',
        `${specialist.name} -> ${specialist.active ? 'ACTIVADA' : 'DESACTIVADA'}`
    );

    showAlert(
        'success',
        `✅ Cuenta ${specialist.active ? 'activada' : 'desactivada'}`
    );

    loadAdminDashboard();
}

// ==================== RF-18 DESACTIVAR PACIENTE ====================
function togglePatient(patientId) {

    const patient =
        neurofileDB.patients.find(p => p.id === patientId);

    patient.active = !(patient.active !== false);

    saveDatabase();

    addLog(
        'CUENTA_PACIENTE',
        `${patient.username} -> ${patient.active ? 'ACTIVADA' : 'DESACTIVADA'}`
    );

    showAlert(
        'success',
        `✅ Cuenta ${patient.active ? 'activada' : 'desactivada'}`
    );

    loadAdminDashboard();
}
